services:
  database:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - store-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  store-data:

